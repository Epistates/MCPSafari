version: 2

# A release is not proposed until it has been public for seven days, long
# enough for a hijacked or yanked release to be noticed and pulled before it
# reaches a pull request here. That matters most for Actions, which run in CI
# with the repository's tokens as soon as their update merges. Security updates
# ignore the cooldown.
updates:
  - package-ecosystem: swift
    directory: /MCPServer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      swift-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
