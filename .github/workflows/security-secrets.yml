name: Security - Secrets & Dependency Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

# A newer push to a pull request makes the earlier scan moot. Pushes to main
# and scheduled runs are never cancelled, so they always leave a result.
concurrency:
  group: security-secrets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # The checksum is pinned here, next to the version, rather than read
          # from the release it guards: a checksums file published beside a
          # tampered tarball would agree with it. Update both together, taking
          # the value from the release's checksums file for linux_x64.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/gitleaks"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          mkdir -p "${install_dir}"
          cd "${install_dir}"
          curl --fail --location --show-error --silent "${base_url}/${archive}" --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -

          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks git "${GITHUB_WORKSPACE}" --redact --verbose

  osv:
    name: Dependency vulnerabilities (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test SwiftPM OSV audit
        run: python3 .github/scripts/test_audit_swiftpm_osv.py

      - name: Run SwiftPM OSV audit
        run: python3 .github/scripts/audit_swiftpm_osv.py MCPServer/Package.resolved
