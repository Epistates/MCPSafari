name: Security - CodeQL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

# A newer push to a pull request makes the earlier analysis moot. Pushes to
# main and scheduled runs are never cancelled, so they always leave a result.
concurrency:
  group: security-codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (Swift)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not the Xcode releases are built with: CodeQL's Swift extractor
      # supports Swift up to 6.3, so this stays on Xcode 26.6 until it catches
      # up. CI builds and tests with both toolchains, so the source analysed
      # here is known to compile the same way under the newer one.
      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          xcode: '26.6'
          swift: '6.3'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift

      - name: Build
        run: |
          cd MCPServer
          swift build --force-resolved-versions -c release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  javascript:
    name: Analyze (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
