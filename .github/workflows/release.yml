name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate (e.g., v0.3.2); manual runs never publish'
        required: true
        type: string
      validate_distribution:
        description: 'Require signing and validate universal CLI notarization without publishing'
        type: boolean
        default: false

permissions:
  contents: read

env:
  REQUIRE_SIGNING: ${{ github.ref_type == 'tag' || inputs.validate_distribution }}
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            swift_target: arm64-apple-macosx
          - arch: x86_64
            swift_target: x86_64-apple-macosx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate release version and changelog
        if: env.REQUIRE_SIGNING == 'true'
        run: python3 .github/scripts/prepare_release.py notes "$RELEASE_VERSION" /tmp/release-notes.md

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail

          for app in /Applications/Xcode_26.6.app /Applications/Xcode_26.6.0.app /Applications/Xcode.app; do
            if [ -d "$app/Contents/Developer" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done

          xcodebuild -version
          swift --version
          swift --version | grep -q "Apple Swift version 6.3" || {
            echo "::error::Swift 6.3 is required to build MCPServer"
            exit 1
          }

      # ── Code Signing ────────────────────────────────────────────

      # A tag is a real release and must fail closed. Homebrew 5.0.0 rejects casks
      # that do not pass Gatekeeper, so an ad-hoc fallback here does not degrade
      # gracefully: it publishes a green release whose cask is broken for every
      # user. The lenient path exists for workflow_dispatch dry runs only.
      - name: Import Apple Code Signing Certificate
        continue-on-error: ${{ github.ref_type != 'tag' && !inputs.validate_distribution }}
        # Pinned by commit: this one is handed the signing certificate, so a moved
        # tag would be handed it too. The trailing comment is load-bearing, it is
        # what lets Dependabot propose the next version.
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Verify Certificate
        run: |
          if security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            echo "APPLE_CERT_IMPORTED=true" >> "$GITHUB_ENV"
            echo "✓ Developer ID certificate found"
          elif [ "$REQUIRE_SIGNING" = "true" ]; then
            echo "::error::No Developer ID certificate available. A tagged release or strict distribution check must be signed and notarized, so this is a hard failure rather than an ad-hoc fallback. Check APPLE_CERTIFICATE_BASE64 and APPLE_CERTIFICATE_PASSWORD, which expire."
            exit 1
          else
            echo "APPLE_CERT_IMPORTED=false" >> "$GITHUB_ENV"
            echo "⚠ No Developer ID certificate, ad-hoc signing this dry run"
          fi

      # ── Build MCP Server (Swift CLI) ────────────────────────────

      - name: Build MCPSafari CLI
        run: |
          cd MCPServer
          swift build -c release --arch ${{ matrix.arch }}

      - name: Sign CLI binary
        run: |
          BINARY="MCPServer/.build/release/MCPSafari"
          if [ "$APPLE_CERT_IMPORTED" = "true" ]; then
            codesign --force --verify --verbose \
              --timestamp --options runtime \
              --sign "${{ secrets.APPLE_DEVELOPER_ID }}" \
              "$BINARY"
            echo "✓ CLI signed with Developer ID"
          else
            codesign -s - --force "$BINARY"
            echo "⚠ CLI ad-hoc signed"
          fi

      # ── Build Safari Extension (Xcode) ──────────────────────────

      - name: Build Safari Extension
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID }}
          SIGNING_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signing=(CODE_SIGNING_ALLOWED=NO)
          if [ "$APPLE_CERT_IMPORTED" = "true" ]; then
            signing=("CODE_SIGN_IDENTITY=$SIGNING_IDENTITY" "DEVELOPMENT_TEAM=$SIGNING_TEAM" CODE_SIGN_STYLE=Manual)
          fi
          cd MCPSafari
          xcodebuild -project MCPSafari.xcodeproj \
            -scheme "MCPSafari" \
            -configuration Release \
            -arch ${{ matrix.arch }} \
            -derivedDataPath build \
            "${signing[@]}" \
            build

      - name: Sign and notarize app
        if: env.APPLE_CERT_IMPORTED == 'true'
        run: |
          APP_PATH="MCPSafari/build/Build/Products/Release/MCPSafari.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::xcodebuild reported success but produced no MCPSafari.app. Releasing without it would ship a cask with no app in it."
            exit 1
          fi

          # Sign the extension appex first (inner-to-outer signing order)
          APPEX_PATH="$APP_PATH/Contents/PlugIns/MCPSafari Extension.appex"
          codesign --force --verify --verbose \
            --timestamp --options runtime \
            --sign "${{ secrets.APPLE_DEVELOPER_ID }}" \
            --entitlements "MCPSafari/MCPSafari Extension/MCPSafari Extension.entitlements" \
            "$APPEX_PATH"

          # Sign the host app
          codesign --force --verify --verbose \
            --timestamp --options runtime \
            --sign "${{ secrets.APPLE_DEVELOPER_ID }}" \
            --entitlements "MCPSafari/MCPSafari/MCPSafari.entitlements" \
            "$APP_PATH"

          # Create ZIP for notarization
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "MCPSafari-notarize.zip"

          # Notarize
          xcrun notarytool submit "MCPSafari-notarize.zip" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait \
            --timeout 30m

          # Staple
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          spctl --assess --type execute --verbose "$APP_PATH"
          echo "✓ App signed, notarized, and stapled"

      # ── Package Artifacts ───────────────────────────────────────

      - name: Package artifacts
        run: |
          mkdir -p artifacts

          # MCP Server binary
          CLI_NAME="MCPSafari-Server-${{ matrix.arch }}-apple-darwin"
          cp MCPServer/.build/release/MCPSafari "artifacts/$CLI_NAME"
          chmod +x "artifacts/$CLI_NAME"
          shasum -a 256 "artifacts/$CLI_NAME" | awk '{print $1 "  '"$CLI_NAME"'"}' > "artifacts/$CLI_NAME.sha256"

          # Safari Extension app bundle
          APP_PATH="MCPSafari/build/Build/Products/Release/MCPSafari.app"
          test -d "$APP_PATH"
          if [ -d "$APP_PATH" ]; then
            APP_ARCHIVE="MCPSafari-Extension-${{ matrix.arch }}.tar.gz"
            tar -czf "artifacts/$APP_ARCHIVE" -C "$(dirname "$APP_PATH")" "MCPSafari.app"
            shasum -a 256 "artifacts/$APP_ARCHIVE" | awk '{print $1 "  '"$APP_ARCHIVE"'"}' > "artifacts/$APP_ARCHIVE.sha256"
          fi

          echo "Artifacts:"
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

  # ── Create Universal Binary + Release ─────────────────────────

  release:
    name: Validate distribution
    runs-on: macos-26
    needs: build
    timeout-minutes: 45
    permissions:
      contents: write
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.validate_distribution)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Validate artifacts and create universal CLI binary
        run: |
          set -euo pipefail
          mkdir -p final-release
          for arch in arm64 x86_64; do
            dir="release-artifacts/$arch"
            binary="MCPSafari-Server-$arch-apple-darwin"
            archive="MCPSafari-Extension-$arch.tar.gz"
            test -s "$dir/$binary"
            test -s "$dir/$archive"
            (cd "$dir" && shasum -a 256 -c "$binary.sha256" "$archive.sha256")
            codesign --verify --strict "$dir/$binary"
            lipo "$dir/$binary" -verify_arch "$arch"
            cp "$dir/$binary" "$dir/$archive" final-release/
          done
          lipo -create release-artifacts/arm64/MCPSafari-Server-arm64-apple-darwin \
            release-artifacts/x86_64/MCPSafari-Server-x86_64-apple-darwin \
            -output final-release/MCPSafari-Server-universal-apple-darwin
          chmod +x final-release/MCPSafari-Server-*
          lipo final-release/MCPSafari-Server-universal-apple-darwin -verify_arch arm64 x86_64
          codesign --verify --strict final-release/MCPSafari-Server-universal-apple-darwin

      - name: Notarize distributed CLI binaries
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir cli-notarize
          cp final-release/MCPSafari-Server-* cli-notarize/
          ditto -c -k --keepParent cli-notarize cli-notarize.zip
          xcrun notarytool submit cli-notarize.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 30m --output-format json > notary-result.json
          python3 -c 'import json; r=json.load(open("notary-result.json")); print(r); assert r.get("status") == "Accepted", "CLI notarization was not accepted"'

      - name: Prepare checksums and release notes
        run: |
          python3 .github/scripts/prepare_release.py artifacts final-release
          python3 .github/scripts/prepare_release.py notes "$RELEASE_VERSION" release-notes.md

      - name: Upload validated dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: validated-distribution
          path: |
            final-release/*
            release-notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        # Pinned by commit: this one holds a token that can write releases.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 'MCPSafari ${{ github.ref_name }}'
          body_path: release-notes.md
          files: |
            final-release/*
          generate_release_notes: false
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
