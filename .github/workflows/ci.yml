name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  # The release workflow runs this whole file as its test gate, so a release is
  # held to exactly what CI checks and the two cannot drift apart.
  workflow_call:

# Building and testing needs nothing but the source. Stated per workflow rather
# than left to the repository default, so widening that default later cannot
# quietly widen this.
permissions:
  contents: read

# A newer push to a pull request makes the earlier run moot. Pushes to main are
# never cancelled, so every commit on main keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    # Two toolchains. Xcode 27.1 is what releases are built with and what a
    # maintainer qualifies against; it runs on GitHub's `xcode-27` image, which
    # GitHub still labels preview. Xcode 26.6 on the GA image keeps the oldest
    # supported compiler honest, since Package.swift asks only for Swift 6.3,
    # and it is the newest toolchain CodeQL can analyse.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            xcode: '27.1'
            swift: '6.4'
          - runner: macos-26
            xcode: '26.6'
            swift: '6.3'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned rather than taken from whatever the runner image ships, so a
      # runner image update cannot change the Node the extension tests run on.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # Runs the pinned TypeScript for the extension type check (`bunx`).
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          xcode: ${{ matrix.xcode }}
          swift: ${{ matrix.swift }}

      - name: Build MCP Server
        run: |
          cd MCPServer
          swift build --force-resolved-versions

      - name: Test MCP Server
        run: |
          cd MCPServer
          swift test --force-resolved-versions

      # A test left waiting on a promise that never settles would otherwise hold
      # the job until its own timeout, which names no test.
      - name: Test extension scripts
        run: node --test --test-timeout=60000 Tests/*.mjs

      # The extension scripts are untyped and share globals across files, so a
      # misspelled cross-file name is a ReferenceError at runtime that no test
      # may reach. Only undeclared names (TS2304, TS2552) and wrong argument
      # counts (TS2554) fail the build: the remaining diagnostics are type-shape
      # complaints about plain JavaScript that are not worth fixing yet.
      - name: Type-check extension scripts
        run: |
          set -uo pipefail
          status=0
          bunx --package typescript@7.0.2 tsc -p tsconfig.json --pretty false > "$RUNNER_TEMP/tsc.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/tsc.log"
          # A crash or a bad config prints no file-level diagnostics, so
          # without this a broken checker would look like a clean one.
          if [ "$status" -ne 0 ] && ! grep -q 'error TS' "$RUNNER_TEMP/tsc.log"; then
            echo "::error::tsc did not run to completion"
            exit 1
          fi
          if grep -E ': error TS(2304|2552|2554):|^error TS' "$RUNNER_TEMP/tsc.log"; then
            echo "::error::Extension scripts use an undeclared name or pass the wrong number of arguments"
            exit 1
          fi

      - name: Test MCP tool result contracts
        run: node --test .github/scripts/test_mcp_results.mjs

      - name: Test release preparation
        run: python3 .github/scripts/test_prepare_release.py

      - name: Test MCP handshake and bridge status
        run: |
          swift build --package-path MCPServer --force-resolved-versions -c release
          python3 .github/scripts/smoke_mcp.py MCPServer/.build/release/MCPSafari

      - name: Build Safari Extension
        run: |
          cd MCPSafari
          xcodebuild -project MCPSafari.xcodeproj \
            -scheme "MCPSafari" \
            -configuration Debug \
            build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      # Release is the configuration that treats warnings as errors and is the
      # one that ships. Without this the first Release build of a change would
      # be the tagged release run, after its approval gate.
      - name: Build Safari Extension (Release)
        run: |
          cd MCPSafari
          xcodebuild -project MCPSafari.xcodeproj \
            -scheme "MCPSafari" \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/release-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The extension's token reader is the only path a token takes to Safari,
      # and every way it can fail is silent, so its unit tests run here too.
      - name: Test Safari Extension token reader
        run: |
          cd MCPSafari
          xcodebuild test -project MCPSafari.xcodeproj \
            -scheme "MCPSafari" \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO
